<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="RAMSONS — Cada dia mais você">
<title>RAMSONS</title>
<style>
  :root {
    --vh: 1vh;
    --ink: #f3f3f5;
    --red: #e10b1d;
    --red-hot: #ff3b4a;
  }
  @supports (height: 1dvh) { :root { --vh: 1dvh; } }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    color: var(--ink);
    font-family: "Montserrat", "Inter", "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- Escena ---------- */
  .scene {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }
  #gl {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* Alternativa sin WebGL: túnel falso con gradientes */
  .fallback {
    display: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 50% 56%;
    transition: transform 1.8s cubic-bezier(.55, 0, .85, .45);
  }
  .fallback i {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse 5% 16% at 50% 56%, #fff1ee 0, rgba(255, 90, 100, .95) 40%, rgba(255, 90, 100, 0) 100%),
      radial-gradient(ellipse 34% 30% at 50% 56%, rgba(255, 32, 50, .55), rgba(150, 6, 20, .22) 55%, rgba(150, 6, 20, 0) 100%),
      repeating-conic-gradient(from 0deg at 50% 56%, rgba(255, 255, 255, .045) 0 .35deg, rgba(255, 255, 255, 0) .35deg 11.25deg),
      radial-gradient(ellipse at 50% 56%, #1a0507 0, #060203 45%, #000 100%);
  }
  .no-gl #gl { display: none; }
  .no-gl .fallback { display: block; }
  .no-gl.entering .fallback { transform: scale(2.2); }

  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 56%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, .62) 100%);
  }

  /* ---------- Interfaz ---------- */
  .ui {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    -webkit-user-select: none;
    user-select: none;
  }
  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(28px, 7vh, 64px);
    max-width: 100%;
    transform: translateY(-3vh);
  }

  .lockup {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
    transition:
      transform 1s cubic-bezier(.5, 0, .9, .5),
      opacity .9s ease-in .05s,
      filter .9s ease-in;
  }
  .lockup::before {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 150%; height: 180%;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(0, 0, 0, .58), rgba(0, 0, 0, 0));
    z-index: -1;
    pointer-events: none;
  }

  .brand {
    margin: 0;
    font-weight: 900;
    font-size: clamp(3rem, 12vw, 8rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    position: relative;
    display: inline-block;
    color: transparent;
    -webkit-text-fill-color: transparent;
    background: linear-gradient(
      to right,
      #444 0%,
      #fff 45%,
      #fff 55%,
      #444 100%
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    animation: ramsons-shine 6s linear infinite;
  }
  @keyframes ramsons-shine {
    to { background-position: 200% center; }
  }

  .tagline {
    margin: .85em 0 0;
    max-width: 100%;
    font-weight: 300;
    font-size: clamp(.92rem, .8rem + 1.4vw, 1.6rem);
    letter-spacing: .22em;
    text-indent: .22em;
    line-height: 1.35;
    color: rgba(236, 236, 240, .82);
    text-shadow: 0 0 18px rgba(0, 0, 0, .95), 0 0 3px rgba(0, 0, 0, .9);
    text-wrap: balance;
  }

  .cta {
    transition: opacity .35s ease, transform .35s ease;
  }
  .btn {
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    min-width: min(280px, 82vw);
    padding: 0 2.4rem;
    font: 600 .95rem/1 "Montserrat", "Inter", "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
    letter-spacing: .24em;
    text-indent: .24em;
    text-decoration: none;
    white-space: nowrap;
    color: #f6f6f8;
    background: linear-gradient(180deg, rgba(22, 22, 26, .74), rgba(8, 8, 10, .86));
    border: 1px solid rgba(255, 48, 64, .75);
    border-radius: 3px;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, .65),
      0 0 22px rgba(255, 24, 44, .18),
      inset 0 0 18px rgba(255, 24, 44, .08);
    cursor: pointer;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition:
      transform .25s ease,
      border-color .25s ease,
      box-shadow .3s ease,
      background .3s ease,
      color .25s ease;
  }
  .btn::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(100deg, rgba(255, 70, 84, 0) 30%, rgba(255, 70, 84, .3) 50%, rgba(255, 70, 84, 0) 70%);
    transform: translateX(-120%);
    transition: transform .7s ease;
    z-index: -1;
  }
  @media (hover: hover) {
    .btn:hover {
      border-color: #ff4a58;
      color: #fff;
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .65),
        0 0 34px rgba(255, 30, 50, .36),
        inset 0 0 22px rgba(255, 30, 50, .16);
    }
    .btn:hover::before { transform: translateX(120%); }
  }
  .btn:focus-visible {
    outline: 2px solid #ff6a75;
    outline-offset: 5px;
  }
  .btn:active {
    transform: scale(.97);
    border-color: #ff5a66;
    background: linear-gradient(180deg, rgba(130, 8, 20, .85), rgba(50, 2, 8, .92));
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, .65),
      0 0 14px rgba(255, 30, 50, .3),
      inset 0 0 26px rgba(255, 30, 50, .28);
  }
  .btn[aria-disabled="true"] { cursor: default; }

  /* ---------- Transición de salida (solo transiciones, sin animaciones) ---------- */
  .flash, .fade {
    position: fixed;
    pointer-events: none;
    opacity: 0;
  }
  .flash {
    z-index: 3;
    left: 50%; top: 56%;
    width: 100vmax; height: 100vmax;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(.3);
    background: radial-gradient(circle closest-side,
      rgba(255, 240, 235, .96) 0%,
      rgba(255, 70, 82, .78) 16%,
      rgba(200, 10, 25, .55) 42%,
      rgba(0, 0, 0, 0) 100%);
    transition: transform 1.2s cubic-bezier(.5, 0, .9, .5) .55s, opacity .6s ease .75s;
  }
  .fade {
    z-index: 4;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    transition: opacity .42s ease 1.38s;
  }
  .entering .lockup { transform: scale(1.5); opacity: 0; filter: blur(10px); }
  .entering .cta { opacity: 0; transform: translateY(10px); }
  .entering .flash { opacity: 1; transform: translate(-50%, -50%) scale(2.6); will-change: transform, opacity; }
  .entering .fade { opacity: 1; }
  .reset *, .reset *::before, .reset *::after { transition: none !important; }

  /* ---------- Secuencia de entrada (solo con movimiento permitido) ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .brand { animation: brandIn 1.9s cubic-bezier(.2, .7, .2, 1) 1.2s both; }
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .brand {
        animation:
          brandIn 1.9s cubic-bezier(.2, .7, .2, 1) 1.2s both,
          sweep 11s ease-in-out 2.2s infinite;
      }
    }
    .tagline { animation: fadeUp 1.3s ease-out 3.1s both; }
    .cta { animation: ctaIn 1.1s ease-out .6s both; }
    .fallback i { animation: sceneIn 3.2s ease-out .2s both; }
    .btn::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 70, 84, .55), 0 0 18px rgba(255, 30, 50, .35);
      opacity: .3;
      pointer-events: none;
      animation: ring 4s ease-in-out 2s infinite alternate;
    }
    .paused .brand, .paused .btn::after { animation-play-state: paused; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .btn::before, .cta, .lockup, .flash, .fade, .fallback { transition-duration: .01s !important; transition-delay: 0s !important; }
    .fade { transition: opacity .35s ease !important; }
    .entering .lockup { transform: none; filter: none; }
    .entering .flash { transform: translate(-50%, -50%) scale(1); }
  }

  @keyframes brandIn {
    from {
      opacity: 0;
      transform: perspective(800px) translate3d(0, 0, -190px);
      filter:
        drop-shadow(0 0 .12em rgba(255, 24, 44, 0))
        drop-shadow(0 .03em .05em rgba(0, 0, 0, 0))
        blur(14px);
    }
    to {
      opacity: 1;
      transform: perspective(800px) translate3d(0, 0, 0);
      filter:
        drop-shadow(0 0 .12em rgba(255, 24, 44, .38))
        drop-shadow(0 .03em .05em rgba(0, 0, 0, .85))
        blur(0px);
    }
  }
  @keyframes sweep {
    0%   { background-position: 100% 0, 0 0; }
    24%  { background-position: 0% 0, 0 0; }
    100% { background-position: 0% 0, 0 0; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translate3d(0, 10px, 0); filter: blur(6px); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); filter: blur(0); }
  }
  @keyframes ctaIn {
    from { opacity: 0; transform: translate3d(0, 8px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  @keyframes sceneIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes ring {
    from { opacity: .25; }
    to   { opacity: .9; }
  }

  /* ---------- Adaptación ---------- */
  @media (max-height: 420px) {
    .content { gap: 18px; transform: none; }
    .btn { min-height: 52px; }
    .tagline { margin-top: .6em; }
  }
  @media (max-width: 360px) {
    .btn { padding: 0 1.6rem; letter-spacing: .2em; text-indent: .2em; }
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <canvas id="gl"></canvas>
  <div class="fallback"><i></i></div>
</div>
<div class="vignette" aria-hidden="true"></div>

<main class="ui">
  <div class="content">
    <div class="lockup">
      <h1 class="brand">RAMSONS</h1>
      <p class="tagline" lang="pt-BR">Cada dia mais você</p>
    </div>
    <div class="cta">
      <a class="btn" id="enter" href="tienda-3d.html">ENTRAR NA LOJA</a>
    </div>
  </div>
</main>

<div class="flash" aria-hidden="true"></div>
<div class="fade" aria-hidden="true"></div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2 uRes;
uniform float uTime;
uniform float uReveal;
uniform float uCam;
uniform vec2 uLook;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

// Línea fina periódica (distancia al entero más cercano) con anti-aliasing por huella de pixel
float lineF(float x, float w, float aa) {
  float d = abs(fract(x + 0.5) - 0.5);
  float l = 1.0 - smoothstep(w * 0.35, w + aa, d);
  return l * clamp(w / (w + aa), 0.0, 1.0);
}

// Reflejo borroso de la rendija de luz del fondo
float slitRefl(vec3 p, vec3 rr, float D, float rough) {
  float t2 = (-D - p.z) / min(rr.z, -1e-3);
  vec3 q = p + rr * t2;
  float gw = 0.045 + rough * (0.02 + 0.012 * t2);
  float gx = exp(-(q.x * q.x) / (2.0 * gw * gw));
  float gy = 1.0 - smoothstep(0.56, 0.8 + gw, abs(q.y));
  return gx * gy;
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  float asp = uRes.x / uRes.y;
  vec2 uv = (frag - 0.5 * uRes) / uRes.y;
  float t = uTime;

  float W = clamp(asp * 1.35, 0.62, 2.1);
  float H = 1.1;
  float D = 15.0;
  float fl = 0.95 - 0.28 * uCam;

  vec3 ro = vec3(uLook.x * 0.14 + sin(t * 0.23) * 0.06,
                 -0.08 + uLook.y * 0.09 + sin(t * 0.31 + 1.3) * 0.03,
                 -uCam * 12.3);
  vec3 rd = normalize(vec3(uv.x, uv.y + 0.06, -fl));

  float sx = rd.x < 0.0 ? -1.0 : 1.0;
  float sy = rd.y < 0.0 ? -1.0 : 1.0;
  float tx = (sx * W - ro.x) / (sx * max(abs(rd.x), 1e-4));
  float ty = (sy * H - ro.y) / (sy * max(abs(rd.y), 1e-4));
  float tz = (-D - ro.z) / min(rd.z, -1e-4);
  float tt = min(tz, min(tx, ty));
  vec3 p = ro + rd * tt;

  vec3 n;
  float kind;
  if (tt == tz) { n = vec3(0.0, 0.0, 1.0); kind = 2.0; }
  else if (tt == ty) { n = vec3(0.0, -sy, 0.0); kind = 0.0; }
  else { n = vec3(-sx, 0.0, 0.0); kind = 1.0; }

  vec3 Lc = vec3(1.0, 0.085, 0.07);
  vec3 Lw = vec3(1.0, 0.45, 0.38);
  float I = uReveal * (1.0 + 0.04 * sin(t * 0.9));

  vec3 L = vec3(0.0, 0.0, -D + 0.5);
  vec3 toL = L - p;
  float dL = length(toL);
  vec3 ld = toL / dL;
  vec3 vd = normalize(ro - p);
  float diff = max(dot(n, ld), 0.0);
  float att = 1.0 / (1.0 + 0.035 * dL * dL);
  float fres = 0.04 + 0.96 * pow(1.0 - max(dot(n, vd), 0.0), 5.0);

  float pa = 1.0 / (uRes.y * fl);
  float fp = tt * pa / max(abs(dot(n, rd)), 0.05);
  float aa = fp * 0.9;

  vec3 alb = vec3(0.05);
  float seam = 0.0;
  float refl = 0.0;
  float gain = 0.0;

  if (kind < 0.5) {
    float tile = hash21(floor(vec2(p.x / (W * 0.5), p.z * 0.5)));
    seam = max(lineF(p.z * 0.5, 0.012, aa * 0.5),
               lineF(p.x / (W * 0.5), 0.01, aa / (W * 0.5)));
    if (n.y > 0.0) {
      alb = vec3(0.06) * (0.8 + 0.4 * tile);
      refl = slitRefl(p, vec3(rd.x, -rd.y, rd.z), D, 0.6);
      gain = 2.4;
    } else {
      alb = vec3(0.045) * (0.85 + 0.3 * tile);
      refl = slitRefl(p, vec3(rd.x, -rd.y, rd.z), D, 1.4);
      gain = 0.5;
    }
  } else if (kind < 1.5) {
    float panel = hash21(vec2(floor(p.z * 0.5), sx));
    seam = max(lineF(p.z * 0.5, 0.012, aa * 0.5),
               lineF(p.y / (H * 0.5), 0.014, aa / (H * 0.5)));
    alb = vec3(0.07) * (0.85 + 0.3 * panel);
    refl = slitRefl(p, vec3(-rd.x, rd.y, rd.z), D, 1.0);
    gain = 0.8;
  } else {
    alb = vec3(0.04);
    seam = 0.0;
  }

  alb *= (1.0 - 0.7 * seam);

  vec3 col = alb * Lc * (diff * att * I * 10.0 + 0.8 * att * I);
  col += Lc * seam * att * I * 0.5;
  col += mix(Lc, Lw, 0.55) * refl * fres * gain * I;

  if (kind > 1.5) {
    float sw = 0.05;
    float sh = 0.7;
    float sxm = 1.0 - smoothstep(sw * 0.6, sw, abs(p.x));
    float sym = 1.0 - smoothstep(sh * 0.85, sh, abs(p.y));
    float s = sxm * sym;
    float core = (1.0 - smoothstep(0.0, sw * 0.6, abs(p.x))) * sym;
    col += Lc * 3.5 * s * I;
    col += vec3(1.0, 0.75, 0.7) * 3.0 * core * I;
  }

  // Resplandor y destello horizontal en pantalla
  vec3 v = L - ro;
  float dz = max(-v.z, 0.2);
  vec2 lp = vec2(fl * v.x / dz, fl * v.y / dz - 0.06);
  vec2 dv = uv - lp;
  float dd = length(dv) * dz;
  float glow = 1.0 / (1.0 + 1.2 * dd * dd);
  float flare = exp(-abs(dv.y) * dz * 6.0) * exp(-abs(dv.x) * dz * 0.35);
  col += Lc * (glow * 0.9 + flare * 0.35) * I * uReveal;

  col = 1.0 - exp(-col * 1.35);

  vec2 vv = frag / uRes - vec2(0.5, 0.44);
  col *= clamp(1.15 - dot(vv, vv) * 1.5, 0.0, 1.0);

  float g = hash21(frag + fract(t) * vec2(41.0, 57.0)) - 0.5;
  col += g * 0.014 * min(1.0, uReveal * 3.0);

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>

<script>
(function () {
  'use strict';

  var root = document.documentElement;
  var t0 = performance.now();
  var EXIT_MS = 1800;

  var link = document.getElementById('enter');
  var canvas = document.getElementById('gl');
  var reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  var coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches : false;

  var gl = null, prog = null, loc = {};
  var raf = 0, running = false, entering = false, enterStart = 0, lastDraw = 0;
  var quality = coarse ? 0.7 : 1.0;
  var MAX_DPR = 1.5;
  var look = { x: 0, y: 0, tx: 0, ty: 0 };
  var perf = { n: 0, acc: 0, drops: 0, last: 0 };

  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }

  /* ---------- WebGL ---------- */
  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      var msg = gl.getShaderInfoLog(s);
      gl.deleteShader(s);
      throw new Error(msg || 'shader');
    }
    return s;
  }

  function initGL() {
    var opts = { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: false };
    gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    if (!gl) throw new Error('webgl');

    var vs = compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
    var fs = compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
    prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.bindAttribLocation(prog, 0, 'aPos');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || 'link');
    gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    ['uRes', 'uTime', 'uReveal', 'uCam', 'uLook'].forEach(function (n) {
      loc[n] = gl.getUniformLocation(prog, n);
    });
    resize();
  }

  function resize() {
    if (!gl) return;
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(2, Math.round(window.innerWidth * dpr * quality));
    var h = Math.max(2, Math.round(window.innerHeight * dpr * quality));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    gl.viewport(0, 0, w, h);
    if (!running) draw(performance.now());
  }

  var resizeQueued = false;
  function queueResize() {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(function () { resizeQueued = false; resize(); });
  }

  function introReveal(el) {
    if (reduceMQ.matches) return 1;
    return smooth((el - 0.25) / 3.4);
  }

  function draw(now) {
    if (!gl || !prog || gl.isContextLost()) return;
    var el = reduceMQ.matches ? 2.0 : (now - t0) / 1000;
    var cam = 0;
    if (entering && !reduceMQ.matches) {
      var p = clamp((now - enterStart) / EXIT_MS, 0, 1);
      cam = p * p * (1.5 - 0.5 * p);
    }
    gl.uniform2f(loc.uRes, canvas.width, canvas.height);
    gl.uniform1f(loc.uTime, el);
    gl.uniform1f(loc.uReveal, introReveal(el));
    gl.uniform1f(loc.uCam, cam);
    gl.uniform2f(loc.uLook, look.x, look.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function frame(now) {
    raf = 0;
    if (!running) return;

    var el = (now - t0) / 1000;
    var moving = Math.abs(look.tx - look.x) > 0.002 || Math.abs(look.ty - look.y) > 0.002;
    var busy = entering || el < 4 || moving;

    // Tras la intro, el movimiento ambiental se dibuja a ~30 fps
    if (!busy && now - lastDraw < 32) {
      raf = requestAnimationFrame(frame);
      return;
    }

    if (perf.last) {
      var dt = now - perf.last;
      if (busy && dt < 250) {
        perf.acc += dt; perf.n++;
        if (perf.n >= 45) {
          if (perf.acc / perf.n > 24 && quality > 0.5 && perf.drops < 3) {
            quality = Math.max(0.5, quality - 0.15);
            perf.drops++;
            resize();
          }
          perf.n = 0; perf.acc = 0;
        }
      }
    }
    perf.last = now;

    look.x += (look.tx - look.x) * 0.06;
    look.y += (look.ty - look.y) * 0.06;
    lastDraw = now;
    draw(now);
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (!gl || running || reduceMQ.matches) { if (gl && reduceMQ.matches) draw(performance.now()); return; }
    running = true;
    perf.last = 0;
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    running = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  function useFallback() {
    stop();
    root.classList.add('no-gl');
  }

  try {
    initGL();
    canvas.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      useFallback();
    }, false);
    canvas.addEventListener('webglcontextrestored', function () {
      try {
        loc = {};
        initGL();
        root.classList.remove('no-gl');
        start();
      } catch (err) { useFallback(); }
    }, false);
    start();
  } catch (err) {
    if (window.console && console.warn) console.warn('RAMSONS: escena WebGL no disponible, usando alternativa CSS.', err);
    gl = null;
    root.classList.add('no-gl');
  }

  /* ---------- Entrada y eventos ---------- */
  window.addEventListener('resize', queueResize);
  window.addEventListener('orientationchange', queueResize);

  window.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    look.tx = clamp((e.clientX / window.innerWidth - 0.5) * 2, -1, 1);
    look.ty = clamp(-(e.clientY / window.innerHeight - 0.5) * 2, -1, 1);
  }, { passive: true });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stop();
      root.classList.add('paused');
    } else {
      root.classList.remove('paused');
      start();
    }
  });

  function onMotionChange() {
    if (reduceMQ.matches) { stop(); if (gl) draw(performance.now()); }
    else { start(); }
  }
  if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', onMotionChange);
  else if (reduceMQ.addListener) reduceMQ.addListener(onMotionChange);

  function go() {
    window.location.assign(link.href);
  }

  function enter() {
    if (entering) return;
    entering = true;
    enterStart = performance.now();
    link.setAttribute('aria-disabled', 'true');
    root.classList.add('entering');
    if (gl && !reduceMQ.matches) { stop(); start(); }
    window.setTimeout(go, reduceMQ.matches ? 420 : EXIT_MS + 60);
  }

  link.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button > 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    enter();
  });
  link.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      link.click();
    }
  });

  // Volver con el botón "atrás" (bfcache): restaurar la pantalla
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    entering = false;
    link.removeAttribute('aria-disabled');
    root.classList.add('reset');
    root.classList.remove('entering');
    void root.offsetWidth;
    root.classList.remove('reset');
    t0 = performance.now() - 6000;
    stop();
    start();
  });
})();
</script>
</body>
</html>
